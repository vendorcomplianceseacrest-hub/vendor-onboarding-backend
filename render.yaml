services:
  - type: web
    name: vendor-onboarding-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: DB_PATH
        value: /var/data/vendors.db
    disk:
      name: vendors-db
      mountPath: /var/data
      sizeGB: 1
